<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Hugo Chen — building Yakitori</title>
  <desc>Editorial profile banner with a warm paper background, bold black typography, and a coral terminal panel.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#111111" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="#F2E9D8"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="20.5" stroke="#111111" stroke-width="3"/>

  <g transform="translate(56 48)">
    <rect width="272" height="30" rx="15" fill="#111111"/>
    <circle cx="17" cy="15" r="5" fill="#E85D3F"/>
    <text x="31" y="20" fill="#F2E9D8" font-size="13" font-weight="700" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">CURRENT FOCUS / YAKITORI</text>

    <text x="0" y="113" fill="#111111" font-size="75" font-weight="900" letter-spacing="-4" font-family="Arial Black, Arial, sans-serif">HUGO CHEN</text>
    <text x="3" y="154" fill="#E85D3F" font-size="22" font-weight="800" letter-spacing="5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">BUILDING AGENT SYSTEMS</text>

    <line x1="0" y1="188" x2="635" y2="188" stroke="#111111" stroke-width="3"/>
    <text x="0" y="225" fill="#111111" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">RUNTIME  ·  MEMORY  ·  COLLABORATION  ·  WORKBENCH</text>
    <text x="0" y="260" fill="#111111" fill-opacity=".66" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">FROM FIRST PRINCIPLES  /  ONE MODULE AT A TIME</text>
  </g>

  <rect x="813" y="48" width="330" height="280" rx="12" fill="#111111"/>
  <g transform="translate(805 40)">
    <rect width="330" height="280" rx="12" fill="#E85D3F" stroke="#111111" stroke-width="3"/>
    <path d="M0 48H330" stroke="#111111" stroke-width="3"/>
    <circle cx="24" cy="24" r="6" fill="#111111"/>
    <circle cx="46" cy="24" r="6" fill="#F2E9D8"/>
    <circle cx="68" cy="24" r="6" fill="#111111" fill-opacity=".28"/>
    <text x="292" y="30" text-anchor="end" fill="#111111" font-size="12" font-weight="800" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">YAKITORI.LOG</text>

    <g fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="24" y="88" font-size="14" font-weight="700">01 / MATES</text>
      <text x="24" y="116" font-size="13">identity → governed memory</text>
      <rect x="24" y="130" width="260" height="3" fill="#111111" fill-opacity=".28"/>

      <text x="24" y="169" font-size="14" font-weight="700">02 / ROOMS</text>
      <text x="24" y="197" font-size="13">messages → collaboration</text>
      <rect x="24" y="211" width="204" height="3" fill="#111111" fill-opacity=".28"/>

      <text x="24" y="250" font-size="14" font-weight="700">03 / INSPECT THE RUN_</text>
    </g>
  </g>
</svg>
